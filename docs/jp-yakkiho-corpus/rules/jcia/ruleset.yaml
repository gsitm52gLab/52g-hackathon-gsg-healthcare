  article_68: 화장품 문안이 미승인 의약품·의료기기·재생의료제품 영역으로 넘어가는 경계를 검출하기 위해 JCIA-R-035에 연결한다.
  rule: 제품이 의약품·의료기기·재생의료제품으로 재분류될 가능성이 있으면 현재 ruleset의 자동 검토를 중단하고 전문가에게 상향한다.
