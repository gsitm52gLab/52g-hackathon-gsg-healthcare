version: 1
policy: >-
  JCIA 자료는 사이트 정책상 사전 연락 없이 전문을 복제·가공하지 않는다.
  이 파일에는 공식 링크와 메타데이터만 보존한다.
opt_in:
  required_env: JCIA_CONTENT_PERMISSION_ACK=I_HAVE_PERMISSION
  prerequisite: 이용허락 증빙을 조직의 승인된 비공개 시스템에 기록한 후 별도 수집 절차로만 사용
  default_enabled: false
